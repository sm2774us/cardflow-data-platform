name: api-tests

# Manual only. Starts the whole stack with Docker Compose and runs the Karate
# and Newman suites against it. Also proves both Docker images build.
#   gh workflow run api-tests.yml
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300 postgres rabbitmq localstack backend
      - name: Karate
        working-directory: api-tests/karate
        run: mvn -B -ntp test -Dkarate.baseUrl=http://localhost:8080
      - name: Newman
        run: npx --yes newman run api-tests/postman/cardflow.postman_collection.json --env-var baseUrl=http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop stack
        if: always()
        run: docker compose down -v
