name: ci

# Runs on pushes to main and on pull requests targeting main -- nothing else.
# (No branch wildcards: a feature branch with an open PR is tested once, not twice.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The three job names below (backend, frontend, infra) are the "required status
# checks" in .github/rulesets/protect-main.json. Rename one => update the ruleset.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit + integration tests (Testcontainers uses the runner's Docker)
        working-directory: backend
        run: mvn -B -ntp verify -Dsurefire.useFile=false -Dfailsafe.useFile=false -DtrimStackTrace=false
      - name: Print test failure reports
        if: failure()
        working-directory: backend
        run: |
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] && { echo "=================== $f"; cat "$f"; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - name: OpenTofu fmt + validate (dev, prod)
        working-directory: infra/opentofu
        run: |
          tofu fmt -check -recursive
          for e in dev prod; do
            (cd envs/$e && tofu init -backend=false -input=false && tofu validate)
          done
      - name: Kustomize renders (dev, prod, openshift)
        run: |
          for o in dev prod openshift; do
            kubectl kustomize k8s/overlays/$o > /dev/null && echo "$o ok"
          done
