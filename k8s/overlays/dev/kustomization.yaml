apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cardflow-dev
resources: [../../base]
patches:
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: ConfigMap, name: cardflow-config }
    patch: |-
      - { op: replace, path: /data/CHAOS_ENABLED, value: "true" }
