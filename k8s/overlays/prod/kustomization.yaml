apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cardflow-prod
resources: [../../base]
images:
  - { name: ghcr.io/sm2774us/cardflow-backend, newTag: "1.0.0" }
  - { name: ghcr.io/sm2774us/cardflow-frontend, newTag: "1.0.0" }
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 4 }
