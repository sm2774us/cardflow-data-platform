# Red Hat OpenShift: same base, Route instead of Ingress. Pods are non-root with no fixed UID, so they admit under
# the default restricted-v2 SCC (OpenShift injects an arbitrary UID; the image grants group 0 the access it needs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cardflow
resources: [../../base, route.yaml]
patches:
  - target: { kind: Ingress, name: cardflow }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: cardflow }
