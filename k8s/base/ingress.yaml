apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardflow
  annotations: { nginx.ingress.kubernetes.io/proxy-buffering: "off", nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" }
spec:
  rules:
    - host: cardflow.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }
