apiVersion: v1
kind: ConfigMap
metadata: { name: cardflow-config }
data:
  LAKE_TYPE: s3
  LAKE_BUCKET: cardflow-lake-raw
  CHAOS_ENABLED: "false"
  CORS_ORIGINS: https://cardflow.example.com
# Secrets (DB_URL/DB_PASSWORD/RABBIT_*/WEBHOOK_SECRET) come from the `cardflow-secrets` Secret,
# materialised by External Secrets / Secrets Store CSI from AWS Secrets Manager — never committed.
